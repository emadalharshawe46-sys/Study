<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>نظام عماد الدراسي</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#222c42;--tx:#e8edf7;--mut:#8d9ab5;--ac:#4cc9f0;--ok:#7bd88f;--warn:#ffb454;--bad:#ff6b6b;--bd:#2c3752}
[data-theme=light]{--bg:#f3f6fb;--card:#fff;--card2:#eef2f9;--tx:#16203a;--mut:#5d6b8a;--ac:#0a7bbf;--ok:#1e9e4a;--warn:#c77700;--bad:#d63b3b;--bd:#d6deec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;font-size:15px}
#app{max-width:680px;margin:0 auto;padding:12px 12px 96px}
h2,h3{margin:.2em 0 .4em}h3{font-size:1.02em;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
.mut{color:var(--mut);font-size:.86em}
.btn{background:var(--ac);color:#06202b;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:5px 12px;font-size:.88em}
.btn.ok{background:var(--ok);color:#06240f}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.grow{flex:1}
.chip{border:1px solid var(--bd);background:var(--card2);color:var(--tx);border-radius:20px;padding:4px 12px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#06202b;border-color:var(--ac);font-weight:700}
input,select,textarea{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;margin:8px 0 3px;font-size:.88em;color:var(--mut)}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:.72em;padding:4px 0;cursor:pointer;border-radius:10px}
#nav button i{display:block;font-style:normal;font-size:1.5em;line-height:1.2}
#nav button.on{color:var(--ac);background:var(--card2);font-weight:700}
.hero{display:flex;gap:14px;align-items:center}
.ringw{position:relative;width:120px;height:120px;flex:none}.ringw svg{width:120px;height:120px}
.rb{fill:none;stroke:var(--card2);stroke-width:10}.rf{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rt b{font-size:1.9em;line-height:1}
.hs div{margin:3px 0}
.timer{text-align:center}.tm{font-size:3em;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:2px}
.bn{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-weight:600}.bn.bad{background:rgba(255,107,107,.15);border:1px solid var(--bad);color:var(--bad)}
.bn.info{background:rgba(76,201,240,.12);border:1px solid var(--ac)}
.task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.task:last-child{border:0}.task span.t{flex:1}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;direction:ltr}.bars div.c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7em;color:var(--mut)}
.bars .b{width:100%;border-radius:6px 6px 0 0;background:var(--ac);min-height:2px}.bars .b.ok{background:var(--ok)}
.pb{height:9px;background:var(--card2);border-radius:6px;overflow:hidden}.pb>i{display:block;height:100%;background:var(--ac)}
.lrow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;cursor:pointer;background:var(--card2)}
.lrow .tt{flex:1}.dot{width:12px;height:12px;border-radius:50%;flex:none}
.steps{padding-inline-start:22px;margin:.3em 0}.steps li{margin:7px 0}
.f{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:6px 0;overflow-x:auto;color:var(--ok);font-size:.95em}
code{direction:ltr;unicode-bidi:isolate;background:var(--card2);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:.92em;color:var(--warn)}
.svgc svg{width:100%;height:auto;direction:ltr;display:block;color:var(--tx)}
.goal{background:rgba(76,201,240,.1);padding:8px 10px;border-radius:10px}
.tip{background:rgba(255,180,84,.12);border-right:4px solid var(--warn);padding:8px 12px;border-radius:10px;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:.9em}td,th{border:1px solid var(--bd);padding:6px;text-align:center}th{background:var(--card2)}
.bk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;padding:4px 0 10px}
.q{font-size:1.1em;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:start;background:var(--card2);border:2px solid var(--bd);color:var(--tx);border-radius:12px;padding:11px;margin:8px 0;font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:rgba(123,216,143,.18)}.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.18)}
.flash{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15em;cursor:pointer;padding:18px;white-space:pre-wrap}
.flash.back{color:var(--ok);direction:auto}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0;z-index:2;cursor:pointer}
.sw i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--bd);border-radius:20px;transition:.2s}.sw i:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{right:23px;background:#fff}
#modal,#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
#ov{background:#0b0f19;color:#e8edf7;z-index:99;text-align:center}
#pill{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--ac);color:#06202b;font-weight:800;padding:5px 16px;border-radius:20px;z-index:30;display:none;cursor:pointer;direction:ltr;font-variant-numeric:tabular-nums}.ovb .big{font-size:5em;animation:sh .5s infinite alternate}.ovb .ot{font-size:3.4em;font-weight:800;direction:ltr}
@keyframes sh{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:20px;z-index:60;display:none;font-weight:700;max-width:90%}
#fact{position:fixed;top:10px;left:10px;right:10px;max-width:660px;margin:auto;z-index:40;display:none}
#snd{width:100%;margin:0 0 10px}
.tag{font-size:.72em;background:var(--card2);border:1px solid var(--bd);border-radius:8px;padding:0 6px;color:var(--mut)}
.pre{white-space:pre-wrap}
.gd .bk,.gd .lbtn{display:none}
.gh{position:sticky;top:0;z-index:10;background:var(--bg);padding:2px 0 8px}
.gh .card{margin:0;border:2px solid var(--ac)}
.gt{font-size:2.8em;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;text-align:center;line-height:1.15}
.big-start{width:100%;font-size:1.3em;padding:16px;border-radius:16px}
.tl{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);align-items:center}.tl b{direction:ltr;unicode-bidi:isolate;min-width:108px;font-size:.9em;color:var(--mut)}
</style>
</head>
<body>
<div id="app">
  <button id="snd" class="btn sec" onclick="ac();this.style.display='none'">🔊 اضغط هنا مرة واحدة بعد فتح الصفحة لتفعيل الأصوات</button>
  <div id="view"></div>
</div>
<div id="nav"></div>
<div id="pill" onclick="go('today')"></div>
<div id="fact"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="ov"></div>
<div id="toast"></div>
<noscript>يلزم تفعيل JavaScript</noscript>

<script>
/* ============ البيانات: المواد والدروس ============ */
const COURSES={
 dc:{n:'Digital Control Systems',code:'EE462',col:'#4cc9f0',ic:'🎛️'},
 lab:{n:'Computer and Control Lab',code:'EE461',col:'#7bd88f',ic:'🔬'},
 pe:{n:'Power Electronics',code:'EE448',col:'#ffb454',ic:'⚡'},
 de:{n:'Digital Electronics',code:'EE419',col:'#c792ea',ic:'🔢'}
};

const SVG_LOOP=`<svg viewBox="0 0 380 118" fill="none" stroke="currentColor" stroke-width="1.5" font-family="sans-serif" font-size="10">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="currentColor" stroke="none"/></marker></defs>
<text x="2" y="30" fill="currentColor" stroke="none">r[k]</text>
<line x1="24" y1="40" x2="38" y2="40" marker-end="url(#ar)"/>
<circle cx="49" cy="40" r="10"/><text x="45" y="44" fill="currentColor" stroke="none">+</text><text x="53" y="62" fill="currentColor" stroke="none">−</text>
<line x1="59" y1="40" x2="74" y2="40" marker-end="url(#ar)"/>
<rect x="76" y="23" width="62" height="34" rx="6"/><text x="85" y="44" fill="currentColor" stroke="none">D(z) CPU</text>
<line x1="138" y1="40" x2="156" y2="40" marker-end="url(#ar)"/>
<rect x="158" y="23" width="62" height="34" rx="6"/><text x="165" y="44" fill="currentColor" stroke="none">DAC+ZOH</text>
<line x1="220" y1="40" x2="238" y2="40" marker-end="url(#ar)"/>
<rect x="240" y="23" width="56" height="34" rx="6"/><text x="254" y="44" fill="currentColor" stroke="none">G(s)</text>
<line x1="296" y1="40" x2="370" y2="40" marker-end="url(#ar)"/><text x="340" y="32" fill="currentColor" stroke="none">y(t)</text>
<path d="M330,40 V98 H232" marker-end="url(#ar)"/>
<rect x="172" y="82" width="60" height="32" rx="6"/><text x="184" y="102" fill="currentColor" stroke="none">ADC (T)</text>
<path d="M172,98 H49 V52" marker-end="url(#ar)"/>
</svg>`;
const SVG_ZCIRCLE=`<svg viewBox="0 0 280 230" fill="none" stroke="currentColor" stroke-width="1.5" font-family="sans-serif" font-size="11">
<circle cx="120" cy="115" r="85" fill="rgba(123,216,143,.18)" stroke="#7bd88f" stroke-width="2"/>
<line x1="10" y1="115" x2="270" y2="115"/><line x1="120" y1="8" x2="120" y2="222"/>
<text x="258" y="108" fill="currentColor" stroke="none">Re</text><text x="126" y="18" fill="currentColor" stroke="none">Im</text>
<text x="200" y="135" fill="currentColor" stroke="none">1</text><text x="30" y="135" fill="currentColor" stroke="none">−1</text>
<text x="70" y="75" fill="#7bd88f" stroke="none" font-size="12">STABLE |z|&lt;1</text>
<text x="168" y="62" fill="#ff6b6b" stroke="none" font-size="12">UNSTABLE</text>
<g stroke-width="3"><path d="M164,103 l10,12 m0,-12 l-10,12" stroke="#7bd88f"/><path d="M92,103 l10,12 m0,-12 l-10,12" stroke="#7bd88f"/><path d="M228,103 l10,12 m0,-12 l-10,12" stroke="#ff6b6b"/></g>
<text x="150" y="150" fill="#7bd88f" stroke="none">z=0.6</text><text x="212" y="150" fill="#ff6b6b" stroke="none">z=1.3</text>
</svg>`;
const SVG_BUCK=`<svg viewBox="0 0 310 135" fill="none" stroke="currentColor" stroke-width="1.6" font-family="sans-serif" font-size="11">
<path d="M30,30 H58 M92,30 H112 M112,30 H135 M185,30 H230 M230,30 H275"/>
<rect x="58" y="19" width="34" height="22" rx="4"/><text x="70" y="34" fill="currentColor" stroke="none">S</text>
<rect x="135" y="21" width="50" height="18" rx="4"/><text x="155" y="34" fill="currentColor" stroke="none">L</text>
<path d="M112,30 V52 M112,82 V112"/><rect x="104" y="52" width="16" height="30" rx="3"/><text x="124" y="72" fill="currentColor" stroke="none">D</text>
<path d="M230,30 V52 M230,82 V112"/><rect x="220" y="52" width="20" height="30" rx="3"/><text x="244" y="72" fill="currentColor" stroke="none">C</text>
<path d="M275,30 V52 M275,82 V112"/><rect x="266" y="52" width="18" height="30" rx="3"/><text x="288" y="72" fill="currentColor" stroke="none">R</text>
<path d="M30,30 V52 M30,82 V112"/><rect x="14" y="52" width="32" height="30" rx="3"/><text x="16" y="72" fill="currentColor" stroke="none">Vin</text>
<path d="M30,112 H275"/><text x="238" y="20" fill="currentColor" stroke="none">Vo</text>
</svg>`;

const LESSONS=[
{id:'dc1',c:'dc',t:'بنية نظام التحكم الرقمي وأخذ العينات',g:'أن تفهم ماذا يحدث للإشارة من الحساس إلى المشغّل عبر الحاسوب.',
 s:['<b>الحساس</b> يعطي إشارة مستمرة y(t) (جهد مثلاً).','<b>ADC</b> يأخذ عينة كل <code>T</code> ثانية فتتحول الإشارة إلى أرقام <code>y[k]=y(kT)</code>.','<b>المعالج</b> يحسب الخطأ <code>e[k]=r[k]−y[k]</code> ثم يطبق قانون التحكم D(z) (معادلة فروق) فيخرج <code>u[k]</code>.','<b>DAC + ZOH</b> يحوّل الرقم إلى جهد ويثبّته ثابتاً طوال الفترة T، فتخرج إشارة سُلّمية.','<b>المشغّل والعملية G(s)</b> تستجيب للإشارة السُلّمية، ثم تتكرر الدورة كل T.'],
 f:['fs = 1 / T','Nyquist:  fs ≥ 2 · f_max'],svg:SVG_LOOP,
 ex:{q:'إشارة أعلى تردد فيها 50 Hz. ما أقل تردد عينة نظرياً، وماذا تختار عملياً؟',a:['<code>fs ≥ 2×50 = 100 Hz</code> ⇒ <code>T ≤ 10 ms</code>.','عملياً في التحكم نختار 10–30 ضعف عرض نطاق الحلقة المغلقة، فنأخذ مثلاً 500 Hz إلى 1 kHz، لأن الحلقة تحتاج عينات أكثر من مجرد استرجاع الإشارة.']},
 tip:'كلما كبرت T قلّ هامش الاستقرار، فالـ ZOH يضيف تأخيراً مكافئاً تقريباً T/2.'},
{id:'dc2',c:'dc',t:'تحويل Z والقيمة النهائية',g:'أن تحوّل أي متتالية إلى z وتستخدم الجدول والخصائص بثقة.',
 s:['عرّف التحويل: <code>X(z)=Σ x[k]·z<sup>−k</sup></code> للقيم k=0…∞.','احفظ الأزواج الأساسية من الجدول أدناه.','خاصية التأخير: <code>Z{x[k−1]} = z<sup>−1</sup>X(z)</code> (بشروط ابتدائية صفرية). هذه أساس تحويل z إلى معادلة فروق.','القيمة النهائية: <code>x(∞)=lim<sub>z→1</sub> (z−1)X(z)</code> بشرط أن تكون أقطاب (z−1)X(z) كلها داخل دائرة الوحدة.'],
 html:'<div class="card"><h3>جدول الأزواج</h3><table dir="ltr"><tr><th>x[k]</th><th>X(z)</th></tr><tr><td>δ[k]</td><td>1</td></tr><tr><td>u[k] (step)</td><td>z/(z−1)</td></tr><tr><td>a<sup>k</sup></td><td>z/(z−a)</td></tr><tr><td>kT (ramp)</td><td>Tz/(z−1)²</td></tr><tr><td>e<sup>−akT</sup></td><td>z/(z−e<sup>−aT</sup>)</td></tr></table></div>',
 ex:{q:'أوجد X(z) للمتتالية x[k]=0.5<sup>k</sup> ثم قيمتها النهائية.',a:['من الجدول مع <code>a=0.5</code>: <code>X(z)=z/(z−0.5)</code>.','القطب عند 0.5 داخل دائرة الوحدة، فالشرط محقق.','<code>(z−1)·z/(z−0.5)</code> عند z=1 تساوي <code>0</code>.','إذن x(∞)=0، وهذا منطقي لأن 0.5<sup>k</sup> يتلاشى.']},
 tip:'قبل استخدام نظرية القيمة النهائية افحص الاستقرار دائماً وإلا ستحصل على جواب خاطئ.'},
{id:'dc3',c:'dc',t:'دالة النقل النبضية مع ZOH',g:'أن تحوّل G(s) إلى G(z) للعملية المسبوقة بماسك ZOH.',
 s:['اكتب <code>G(s)/s</code> (اضرب في 1/s لأن الماسك يحوّل الإدخال لقفزات).','حلّل بالكسور الجزئية.','حوّل كل حد بجدول Z.','اضرب النتيجة في <code>(1−z<sup>−1</sup>) = (z−1)/z</code>.','تحقق: <code>G(z)|<sub>z=1</sub> = G(s)|<sub>s=0</sub></code> أي الكسب الساكن لا يتغير.'],
 f:['G(z) = (1 − z⁻¹) · Z{ G(s) / s }'],
 ex:{q:'G(s)=1/(s+a) مع ZOH وفترة عينة T. أوجد G(z)، ثم اعتبر a=2, T=0.1.',a:['<code>G(s)/s = 1/[s(s+a)] = (1/a)(1/s − 1/(s+a))</code>.','<code>Z = (1/a)[ z/(z−1) − z/(z−e<sup>−aT</sup>) ]</code>.','اضرب في (z−1)/z: <code>(1/a)[1 − (z−1)/(z−e<sup>−aT</sup>)] = (1−e<sup>−aT</sup>) / [a(z−e<sup>−aT</sup>)]</code>.','بالتعويض: <code>e<sup>−0.2</sup>=0.8187</code> فالنتيجة <code>G(z)=0.0906/(z−0.8187)</code>.','فحص: G(1)=0.0906/0.1813=0.5 وهو G(0)=1/a=0.5 ✓.']},
 tip:'القطب s=−a يصبح z=e^(−aT). كل قطب في s له نظير في z بهذه القاعدة.'},
{id:'dc4',c:'dc',t:'الاستقرار في المستوى z واختبار Jury',g:'أن تحكم على استقرار نظام رقمي وتجد أعلى كسب مسموح.',
 s:['اكتب المعادلة المميزة (مقام الحلقة المغلقة): <code>1+KG(z)=0</code>.','الشرط: <b>كل الجذور</b> داخل دائرة الوحدة <code>|z|&lt;1</code>.','للدرجة الثانية <code>P(z)=a₂z²+a₁z+a₀</code> مع a₂&gt;0 استخدم Jury: <code>P(1)&gt;0</code> و <code>P(−1)&gt;0</code> و <code>|a₀|&lt;a₂</code>.','للدرجة الأولى: اجعل الجذر z₁ وتأكد أن <code>|z₁|&lt;1</code>.'],
 f:['s-plane: Re(s) < 0   ⇔   z-plane: |z| < 1','z = e^(sT)'],svg:SVG_ZCIRCLE,
 ex:{q:'في المثال السابق G(z)=0.0906/(z−0.8187). أوجد مجال K المستقر في الحلقة المغلقة (تغذية عكسية سالبة).',a:['المعادلة المميزة: <code>1+K·0.0906/(z−0.8187)=0</code> ⇒ <code>z = 0.8187 − 0.0906K</code>.','الشرط: <code>−1 &lt; 0.8187 − 0.0906K &lt; 1</code>.','الطرف الأيمن: <code>K &gt; −2</code>. الطرف الأيسر: <code>0.0906K &lt; 1.8187 ⇒ K &lt; 20.06</code>.','للكسب الموجب: <code>0 &lt; K &lt; 20.06</code>.'],
 },tip:'نفس النظام المستمر 1/(s+2) مستقر لأي K، لكن الرقمي يفقد الاستقرار عند كسب عالٍ. هذا أثر أخذ العينات.'},
{id:'dc5',c:'dc',t:'معادلات الفروق والـ PID الرقمي',g:'أن تحوّل G(z) إلى كود قابل للتنفيذ في المتحكم.',

 const s=sunInfo(d),lat=S.set.lat*RAD,tz=-d.getTimezoneOffset()/60,noon=12+tz-S.set.lng/15-s.eqt;
 const hrs=A=>Math.acos((-Math.sin(A*RAD)-Math.sin(lat)*Math.sin(s.dec))/(Math.cos(lat)*Math.cos(s.dec)))/RAD/15;
 const m=METHODS[S.set.method]||METHODS.egypt;
 return Math.round((m[1]?noon+hrs(m[1]):noon+hrs(0.833)+1.5)*60);
}
function ishaFor(d){if(S.ishaMan&&S.ishaMan.d===dk(d))return S.ishaMan.m;return ishaCalc(d)+(+S.set.off||0)}
const schedFor=day=>{const v=(S.sched||{})[day];if(v!==undefined)return v==='rest'?null:v;return SCHED[day]};
function blockSpec(d){
 const sc=schedFor(d.getDay());if(!sc)return [];
 const list=BLK.filter(b=>b.n!==2||sc!=='weak').map(b=>({n:b.n,m:b.m}));
 const cp=S.set.cutoff.split(':').map(Number),cmm=cp[0]*60+cp[1],endm=cmm<300?cmm+1440:cmm;
 const start=ishaFor(d)+(+S.set.gap||0),fit=()=>endm-start-15*(list.length-1);
 [2,3].forEach(n=>{if(fit()<list.length*30){const i=list.findIndex(b=>b.n===n);if(i>=0)list.splice(i,1)}});
 const sum=list.reduce((a,b)=>a+b.m,0),avail=fit();
 if(avail<sum){const f=Math.max(.3,avail/sum);list.forEach(b=>b.m=Math.max(15,Math.round(b.m*f/5)*5))}
 const tot=()=>list.reduce((a,b)=>a+b.m,0);
 while(tot()>avail&&list.some(b=>b.m>15)){const mx=list.reduce((a,b)=>b.m>a.m?b:a);mx.m-=5}
 let cur=start;list.forEach(b=>{b.s=cur;b.t=fmtM(cur);cur+=b.m+15});

function startQuiz(mode,arg){
 const pool=allQ();let list;
 if(mode==='daily'){const w=shuffle(pool.filter(x=>S.wrong.includes(x.id))).slice(0,2);list=w.concat(shuffle(pool.filter(x=>!w.includes(x))))}
 else if(mode==='course')list=shuffle(pool.filter(x=>x.c===arg)).slice(0,8);
 else if(mode==='lesson')list=shuffle(pool.filter(x=>x.l===arg));
 else if(mode==='week')list=shuffle(pool).slice(0,15);
 else list=shuffle(pool.filter(x=>S.wrong.includes(x.id)));
 if(mode==='daily')list=list.slice(0,5);
 if(!list.length){toast('لا توجد أسئلة هنا بعد');return}
 Qs={mode,i:0,score:0,sel:null,miss:[],saved:false,list:list.map(x=>{const ix=shuffle(x.o.map((_,j)=>j));return Object.assign({},x,{o:ix.map(j=>x.o[j]),a:ix.indexOf(x.a)})})};
 if(!gActive()){tab='quiz';lid=null;render();scrollTo(0,0)}
}
function vQuiz(){
 if(!Qs){const wc=S.wrong.length;return `<div class="card"><h3>📝 اختبار اليوم</h3><p class="mut">5 أسئلة مختلطة، وتدخل فيها أسئلة أخطأت فيها سابقاً.</p><button class="btn" style="width:100%" onclick="startQuiz('daily')">ابدأ الاختبار اليومي</button></div>
 <div class="card"><h3>حسب المادة</h3>${Object.entries(COURSES).map(([k,c])=>`<button class="btn sec" style="width:100%;margin:4px 0;border-right:5px solid ${c.col}" onclick="startQuiz('course','${k}')">${c.ic} ${c.code} · ${c.n}</button>`).join('')}</div>
 <div class="card"><h3>🔁 بنك أخطائي</h3><p class="mut">${wc?`لديك ${wc} سؤالاً أخطأت فيه. كررها حتى تثبت.`:'لا أخطاء مسجلة. ممتاز!'}</p><button class="btn sec" ${wc?'':'disabled'} onclick="startQuiz('wrong')">راجع أخطائي</button></div>`}
 if(Qs.i>=Qs.list.length)return qResult();
 const q=Qs.list[Qs.i],C=COURSES[q.c];
 return `<button class="bk" onclick="Qs=null;render()">→ إنهاء</button><div class="card"><div class="pb"><i style="width:${Qs.i/Qs.list.length*100}%"></i></div><p class="mut">سؤال ${Qs.i+1} من ${Qs.list.length} · ${C?C.code:''}</p><div class="q" dir="auto">${esc(q.q)}</div>
 ${q.o.map((o,j)=>`<button class="opt ${Qs.sel===null?'':j===q.a?'right':j===Qs.sel?'wrong':''}" dir="auto" onclick="qAns(${j})">${esc(o)}</button>`).join('')}
 ${Qs.sel!==null?`<div class="tip" dir="auto">${Qs.sel===q.a?'✅ صحيح. ':'❌ الصحيح موضّح بالأخضر. '}${esc(q.e||'')}</div><button class="btn" style="width:100%" onclick="Qs.i++;Qs.sel=null;render()">${Qs.i+1>=Qs.list.length?'عرض النتيجة':'التالي ›'}</button>`:''}</div>`;
}
function qAns(j){if(Qs.sel!==null)return;const q=Qs.list[Qs.i];Qs.sel=j;if(j===q.a){Qs.score++;S.wrong=S.wrong.filter(x=>x!==q.id)}else{Qs.miss.push(q);if(!S.wrong.includes(q.id))S.wrong.push(q.id)}save();render()}
function qResult(){
 const n=Qs.list.length,p=Math.round(Qs.score/n*100);
 if(!Qs.saved){Qs.saved=true;S.qh.push({d:dk(),s:Qs.score,n});if(gActive()){S.guide.stats.q+=n;S.guide.stats.qc+=Qs.score}if(S.qh.length>60)S.qh.shift();(S.day[dkey()]=S.day[dkey()]||{}).quiz=true;save()}
 return `<div class="card" style="text-align:center"><div style="font-size:3em">${p>=80?'🏆':p>=50?'👍':'💪'}</div><h2>${Qs.score} / ${n} (${p}%)</h2><p class="mut">${p>=80?'ممتاز، أنت متمكن.':p>=50?'جيد، راجع الأخطاء أدناه.':'لا بأس، راجع الدرس وأعد المحاولة.'}</p></div>
 ${Qs.miss.length?`<div class="card"><h3>أخطاؤك</h3>${Qs.miss.map(q=>`<div class="task" style="display:block" dir="auto"><b>${esc(q.q)}</b><br><span style="color:var(--ok)">✔ ${esc(q.o[q.a])}</span><br><span class="mut">${esc(q.e||'')}</span></div>`).join('')}</div>`:''}

}

let curA=null;
function slackNow(){
 const pend=dayBlocks().filter(b=>!blockDone(b)&&!b.am);if(!pend.length)return 0;
 const need=pend.reduce((s,b)=>s+b.m,0)+15*(pend.length-1),cp=S.set.cutoff.split(':').map(Number),c=cp[0]*60+cp[1],endm=c<300?c+1440:c;
 return endm-nowStudyMin()-need;
}
function postInfo(a){const k=dk()+'#'+a.blk,p=S.post[k]||0;return {k,p,left:Math.max(0,S.set.snoozeMax-p)}}
function fire(a){
 if(a.studyOnly&&!dayBlocks().length)return;
 if(a.blk){
  const b0=dayBlocks().find(b=>b.n===a.blk);if(!b0||blockDone(b0)||amExpired(b0))return;
  if(S.timer){if(S.timer.kind==='study'){toast('⏰ '+a.label+' — أكمل جلستك الحالية');ac();play('chime')}return}
 }else if(S.timer&&S.timer.kind==='study'){toast('⏰ '+a.label);ac();play('chime');return}
 curA=a;playLoop(a.sound||S.set.sound);try{navigator.vibrate&&navigator.vibrate([500,250,500,250,800])}catch(e){}
 notify('⏰ '+a.label,'افتح التطبيق: ابدأ أو أجّل');
 const bb=a.blk?dayBlocks().find(b=>b.n===a.blk):null,c=bb?COURSES[bb.c]:null;
 let body;
 if(bb){
  const pi=postInfo(a),sl=slackNow();
  body=`<p class="mut">${c.ic} ${c.code} · ${c.n} · ${bb.m} دقيقة</p>
  <p><button class="btn" style="font-size:1.5em;padding:16px 48px" onclick="startBlock(${bb.n})">▶ ابدأ الآن</button></p>
  <p class="mut">أو أجّل (متبقٍ ${pi.left} من ${S.set.snoozeMax} مرات)</p>
  <p class="row" style="justify-content:center">${pi.left?S.set.snoozeOpts.map(x=>`<button class="btn sec" onclick="postpone(${x})">⏳ ${x} د</button>`).join(''):'<span class="mut">انتهت مرات التأجيل. ابدأ الآن 💪</span>'}</p>
  <p class="${sl<0?'bn bad':'mut'}" style="margin:8px 0">هامش الوقت قبل ${S.set.cutoff}: <b dir="ltr">${sl}</b> د${sl<0?' — لن يتسع كل المقرر، ستُقتطع أواخر الكتل':''}</p>`;
 }else body=`<p><button class="btn" style="font-size:1.3em;padding:14px 40px" onclick="stopAlarm()">إيقاف</button></p><p><button class="btn sec" onclick="snooze()">غفوة 5 دقائق</button></p>`;
 const o=$('#ov');o.innerHTML=`<div class="ovb"><div class="big">⏰</div><div class="ot">${nowHM()}</div><h2 dir="auto">${esc(a.label)}</h2>${body}</div>`;o.style.display='flex';
}

 S.alarms.forEach(a=>{if(!a.on||!a.days.includes(wd))return;

 S.lastSeen=Date.now();save();

}

let GC=null,gWarn=-1,gLastPing=0,lastActive=(S.guide&&S.guide.la)||Date.now();
const hm=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const gActive=()=>!!(S.guide&&!S.guide.done);
const TT={6:['dc','de'],0:['pe','dc'],1:['de','lab'],2:['dc','pe'],3:['pe','de'],4:['lab','dc'],5:null};
function buildPlan(ts){
 const t=TT[new Date(ts-5*3600e3).getDay()],ALL=['dc','pe','de','lab'];
 let segs=t?[{k:'study',c:t[0],m:90},{k:'break',m:15},{k:'study',c:t[1],m:75},{k:'break',m:15},{k:'practice',cs:t,c:t[0],m:60},{k:'break',m:15},{k:'review',c:'mix',m:40}]
  :[{k:'test',c:'mix',m:60},{k:'break',m:15},{k:'practice',cs:ALL,c:'dc',weak:true,m:75},{k:'break',m:15},{k:'practice',cs:ALL,c:'pe',m:60},{k:'break',m:15},{k:'review',c:'mix',m:40}];
 const [eh,em]=S.set.endBy.split(':').map(Number),end=new Date(ts);end.setHours(eh,em,0,0);
 if(end.getTime()<=ts&&new Date(ts).getHours()>=5)end.setDate(end.getDate()+1);
 const avail=Math.max(20,(end.getTime()-ts)/60000);let note='';
 const tot=()=>segs.reduce((a,s)=>a+s.m,0);
 if(tot()>avail){
  if(avail<50){const f=segs[0];segs=[{k:f.k,c:f.c,cs:f.cs,m:Math.max(10,Math.round(avail-15))},{k:'review',c:'mix',m:Math.min(15,Math.max(5,Math.round(avail-10)))}];note='الوقت المتبقي قصير فاختُصرت الجلسة إلى كتلة واحدة + مراجعة.'}
  else{const fx=segs.filter(s=>s.k==='break'||s.k==='review').reduce((a,s)=>a+s.m,0),wk=tot()-fx,f=Math.max(.3,(avail-fx)/wk);segs.forEach(s=>{if(s.k!=='break'&&s.k!=='review')s.m=Math.max(15,Math.round(s.m*f))});note='ضُغطت الكتل لتناسب الوقت حتى '+S.set.endBy+'.'}
 }
 return {segs,note}}

 const st=(new Date().getHours()>=5&&now<ps.getTime())?ps.getTime():now,b=buildPlan(st);let t=st;
 const rows=b.segs.map(s=>{const a=t;t+=s.m*60000;return `<div class="tl"><b>${hm(a)} – ${hm(t)}</b><span>${segLabel(s)}</span></div>`}).join('');
 return `<div class="card" style="border:2px solid var(--ac)"><h3>🌙 جلسة الليلة — ${DN[new Date(st-5*3600e3).getDay()]}</h3><p class="mut">اضغط «ابدأ» فقط. التطبيق يدير المؤقت والاستراحات والمحتوى والتسجيل بدقة، ويخصم أي وقت خمول.</p>${rows}${b.note?`<p class="mut">⚠️ ${b.note}</p>`:''}<button class="btn big-start" style="margin-top:10px" onclick="startGuide()">▶ ابدأ جلسة الليلة</button></div>`}
function startGuide(){

 if(S.guide&&S.guide.done&&S.guide.day===nightKey(now)&&!confirm('أنهيت جلسة الليلة. هل تريد بدء جلسة إضافية؟'))return;
 const b=buildPlan(now),[h,m]=S.set.start.split(':').map(Number),ps=new Date(now);ps.setHours(h,m,0,0);
 let late=Math.round((now-ps.getTime())/60000);if(new Date(now).getHours()<5||late<0||late>360)late=0;
 S.guide={day:nightKey(now),start:now,segs:b.segs,note:b.note,pausedMs:0,pSince:null,idle:b.segs.map(()=>0),logged:b.segs.map(()=>false),lastTick:now,la:now,late,pauses:0,done:false,lid:{},by:{},lm:0,cur:0,stats:{q:0,qc:0,ex:0,exok:0}};
 lastActive=now;GC=null;Qs=null;Cs=null;gWarn=-1;tab='guide';ac();setWake(true);play('bell');save();render();scrollTo(0,0)}
const gEl=()=>{const g=S.guide,n=g.pSince||Date.now();return n-g.start-g.pausedMs};
function gPos(){const g=S.guide,e=gEl()/60000;let a=0;for(let i=0;i<g.segs.length;i++){const m=g.segs[i].m;if(e<a+m)return{i,t:(e-a)*60,rem:(a+m-e)*60,e};a+=m}return{i:g.segs.length,t:0,rem:0,e}}

function addIdle(t0,t1){const g=S.guide,e0=(t0-g.start-g.pausedMs)/60000,e1=(t1-g.start-g.pausedMs)/60000;let a=0;g.segs.forEach((s,i)=>{const b=a+s.m;if(s.k!=='break'){const o=Math.min(e1,b)-Math.max(e0,a);if(o>0)g.idle[i]+=o*60000}a=b})}
function gComplete(k,pm){const g=S.guide;if(g.logged[k])return;g.logged[k]=true;const s=g.segs[k];if(s.k==='break')return;
 const m=Math.max(0,(pm!=null?pm:s.m)-g.idle[k]/60000);
 if(m>0){S.sess.push({d:g.day,c:s.c,m:Math.round(m*10)/10});g.lm+=m;g.by[s.c]=(g.by[s.c]||0)+m}

 save()}

 const g=S.guide,now=Date.now();
 if(g.pSince){g.lastTick=now;return}

 if(p.i<g.segs.length&&g.segs[p.i].k!=='break'){

  else if(ia>thr*.75&&now-gLastPing>thr){gLastPing=now;play('beep');toast('المس الشاشة لتأكيد أنك تدرس')}
 }
 g.la=lastActive;
 if(p.i!==g.cur){for(let k=g.cur;k<Math.min(p.i,g.segs.length);k++)gComplete(k);g.cur=p.i;if(p.i>=g.segs.length){gFinish();return}gSeg(p.i);return}
 if(p.rem<=60&&gWarn!==p.i&&g.segs[p.i].m>3){gWarn=p.i;play('digital')}

function buildPractice(s){
 const cs=s.cs||['dc'];let ls=allLessons().filter(l=>cs.includes(l.c)&&l.ex);const dn=ls.filter(l=>S.done[l.id]);if(dn.length)ls=dn;
 ls=shuffle(ls);if(s.weak)ls.sort((a,b)=>(S.weakL[b.id]||0)-(S.weakL[a.id]||0));
 let qs=shuffle(allQ().filter(q=>cs.includes(q.c)));if(s.weak)qs.sort((a,b)=>(S.wrong.includes(b.id)?1:0)-(S.wrong.includes(a.id)?1:0));
 qs=qs.map(x=>{const ix=shuffle(x.o.map((_,j)=>j));return {t:'q',id:x.id,c:x.c,q:x.q,e:x.e,o:ix.map(j=>x.o[j]),a:ix.indexOf(x.a)}});
 const out=[];let qi=0;ls.forEach(l=>{out.push({t:'ex',L:l.id,c:l.c});for(let k=0;k<2&&qi<qs.length;k++)out.push(qs[qi++])});while(qi<qs.length)out.push(qs[qi++]);return out}

 if(!GC||GC.i!==p.i)gInit(p.i);
 const nx=g.segs[p.i+1];let body;
 if(g.pSince)body=`<div class="card" style="text-align:center"><h2>⏸ متوقف</h2><p class="mut">الوقت لا يُحتسب أثناء التوقف. عُد عندما تكون جاهزاً.</p><button class="btn ok big-start" onclick="gResume()">▶ استئناف</button></div>`;
 else if(s.k==='study')body=gBodyStudy();
 else if(s.k==='break')body=`<div class="card" style="text-align:center"><div style="font-size:4em">☕</div><h2>استراحة</h2><p>قم وتحرّك، اشرب ماء، ابتعد عن الشاشة، ولا تفتح مواقع التواصل.</p>${nx?`<p class="mut">التالي: ${segLabel(nx)}</p>`:''}</div>`;
 else if(s.k==='practice')body=gBodyPractice();
 else body=gBodyQuizFlow();
 const pr=(s.m*60-p.rem)/(s.m*60)*100;
 return `<div class="gd"><div class="gh"><div class="card"><div class="row" style="justify-content:space-between"><b>${segLabel(s)}</b><span class="mut">${p.i+1}/${g.segs.length}</span></div><div class="gt" id="gt">${fmt(p.rem)}</div><div class="pb"><i id="gp" style="width:${pr}%"></i></div><div class="row" style="justify-content:space-between;margin-top:6px"><span class="mut" id="gi">${gInfo()}</span><span><button class="btn sec sm" onclick="gPause()">⏸ طارئ</button> <button class="btn sec sm" onclick="gAbort()">إنهاء مبكر</button></span></div></div></div>${g.note&&p.i===0?`<div class="bn info">⚠️ ${g.note}</div>`:''}${body}</div>`}
function gBodyStudy(){const L=allLessons().find(x=>x.id===GC.L);if(!L)return '<div class="card">لا يوجد درس لهذه المادة. أضف درساً من «المزيد».</div>';
 return `<div class="tip">📖 اقرأ الدرس بتركيز، ثم حلّ المثال على ورقة قبل أن تنظر إلى الحل. يُسجَّل الدرس تلقائياً عند نهاية الكتلة.</div>`+vLesson(L)}
function gBodyQuizFlow(){
 if(GC.ph==='cards'){if(Cs)return vCards();GC.ph='quiz';startQuiz('daily')}
 if(GC.ph==='quiz'){if(Qs)return vQuiz();GC.ph='wrong';if(S.wrong.length)startQuiz('wrong')}
 if(GC.ph==='wrong'){if(Qs)return vQuiz();GC.ph='free'}
 return `<div class="card" style="text-align:center"><div style="font-size:3em">✍️</div><h3>أنهيت الجزء التفاعلي</h3><p>استعمل ما تبقى من الوقت: لخّص ما تعلمته الليلة في 5 أسطر على ورقة بدون النظر، ودوّن أي نقطة لم تفهمها لتسألني عنها.</p></div>`}
function gBodyPractice(){
 const s=S.guide.segs[GC.i];
 if(GC.qi>=GC.q.length)GC.q=GC.q.concat(buildPractice(s));
 const it=GC.q[GC.qi];if(!it)return '<div class="card">لا توجد تمارين بعد. أضف أسئلة من «المزيد».</div>';
 const C=COURSES[it.c],n=GC.qi+1;
 if(it.t==='ex'){const L=allLessons().find(x=>x.id===it.L);
  return `<div class="card"><p class="mut">تمرين تطبيقي ${n} · ${C?C.code:''} · ${esc(L.t)}</p><div class="q">${L.ex.q}</div><p class="mut">حلّه على الورق بخطوات الدرس أولاً، ولا تنظر للحل قبل أن تحاول.</p>${GC.rev?`<ol class="steps">${L.ex.a.map(x=>`<li>${x}</li>`).join('')}</ol><div class="row"><button class="btn ok grow" onclick="gEx(true)">✔ حللتها صح</button><button class="btn bad grow" onclick="gEx(false)">✖ أخطأت أو لم أستطع</button></div>`:`<button class="btn" style="width:100%" onclick="GC.rev=true;render()">أظهر الحل</button>`}</div>`}
 return `<div class="card"><p class="mut">سؤال ${n} · ${C?C.code:''}</p><div class="q" dir="auto">${esc(it.q)}</div>${it.o.map((o,j)=>`<button class="opt ${GC.sel===null?'':j===it.a?'right':j===GC.sel?'wrong':''}" dir="auto" onclick="gQ(${j})">${esc(o)}</button>`).join('')}${GC.sel!==null?`<div class="tip" dir="auto">${GC.sel===it.a?'✅ ':'❌ '}${esc(it.e||'')}</div><button class="btn" style="width:100%" onclick="GC.qi++;GC.sel=null;render()">التالي ›</button>`:''}</div>`}
function gQ(j){if(GC.sel!==null)return;const it=GC.q[GC.qi],g=S.guide;GC.sel=j;g.stats.q++;if(j===it.a){g.stats.qc++;S.wrong=S.wrong.filter(x=>x!==it.id)}else if(!S.wrong.includes(it.id))S.wrong.push(it.id);save();render()}
function gEx(ok){const it=GC.q[GC.qi],g=S.guide;g.stats.ex++;if(ok){g.stats.exok++;if(S.weakL[it.L]){S.weakL[it.L]--;if(S.weakL[it.L]<=0)delete S.weakL[it.L]}}else S.weakL[it.L]=(S.weakL[it.L]||0)+1;GC.qi++;GC.rev=false;save();render()}
function gSummary(){
 const g=S.guide,n=S.nights[S.nights.length-1]||{},sc=n.planned?Math.round(n.logged/n.planned*100):0;
 const by=Object.entries(g.by||{}).map(([k,m])=>{const c=COURSES[k];return `<div class="task"><span class="t">${c?c.ic+' '+c.code:'📚 مراجعة واختبار'}</span><b>${Math.round(m)} د</b></div>`}).join('');
 const ls=Object.values(g.lid||{}).map(id=>{const L=allLessons().find(x=>x.id===id);return L?`<li>${esc(L.t)}</li>`:''}).join('');
 return `<div class="card" style="text-align:center"><div style="font-size:3.5em">${sc>=90?'🏆':sc>=70?'👍':'💪'}</div><h2>ملخص جلسة الليلة</h2><h1 style="margin:.1em;color:var(--ac)">${sc}%</h1><p class="mut">نسبة الالتزام: المسجَّل ÷ المخطط</p></div>
 <div class="card"><h3>📊 الأرقام الدقيقة</h3>
 <div class="task"><span class="t">وقت دراسة مسجَّل</span><b>${n.logged||0} من ${n.planned||0} د</b></div>
 <div class="task"><span class="t">خمول مخصوم</span><b>${n.idle||0} د</b></div>
 <div class="task"><span class="t">توقف طارئ</span><b>${n.paused||0} د (${g.pauses||0} مرة)</b></div>
 <div class="task"><span class="t">التأخر عن موعد البدء</span><b>${n.late||0} د</b></div>
 <div class="task"><span class="t">أسئلة صحيحة</span><b>${n.qc||0}/${n.q||0}</b></div>
 <div class="task"><span class="t">تمارين حللتها صح</span><b>${n.exok||0}/${n.ex||0}</b></div></div>
 ${by?`<div class="card"><h3>⏱️ التوزيع</h3>${by}</div>`:''}
 ${ls?`<div class="card"><h3>📖 دروس أنهيتها الليلة</h3><ol class="steps">${ls}</ol></div>`:''}
 <button class="btn big-start" onclick="go('today')">رجوع للرئيسية</button>`}

/* ============ المحرك الزمني ============ */
function tick(){
 checkAlarms();if(gActive())gTick();
 if(S.timer){const t=S.timer,e=elapsed();const el=$('#tm');if(el)el.textContent=fmt(t.target?t.target*60-e/1000:e/1000);if(t.target&&t.since&&e>=t.target*60000)tFinish(true)}
 snzCheck();pillUpd();const live=todayMin()+(S.timer&&S.timer.kind==='study'?elapsed()/60000:0),rm=$('#rm'),rc=$('#ringc');if(rm)rm.textContent=Math.floor(live);if(rc){const C=2*Math.PI*52;rc.setAttribute('stroke-dashoffset',C*(1-Math.min(100,(goalFor(sdate())?live/goalFor(sdate())*100:100))/100))}
 if(S.set.factOn){if(!S.lastFact){S.lastFact=Date.now();save()}else if(Date.now()-S.lastFact>=S.set.factH*3600000&&!curA&&!(S.timer&&S.timer.kind==='study')&&!gActive())showFact()}
 if(Date.now()-lastSave>20000){S.lastSeen=Date.now();save();lastSave=Date.now()}
}
document.addEventListener('pointerdown',()=>{ac()},{once:true});
['pointerdown','keydown','touchstart','scroll','wheel'].forEach(ev=>addEventListener(ev,()=>{lastActive=Date.now()},{passive:true,capture:true}));
if(gActive())tab='guide';
render();checkMissed();setInterval(tick,1000);tick();
if(S.set.wake||S.timer)setWake(true);
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body>
